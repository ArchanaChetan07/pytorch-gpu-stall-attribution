name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --cov=whystall --cov-report=term-missing
      # The firewall check is not just another test: it is the assertion that
      # the classifier never sees ground truth, without which no number this
      # tool produces means anything. Run it on its own so a failure is
      # unmissable in the log.
      - name: Ground-truth firewall
        run: whystall selftest
      - name: End-to-end pipeline on synthetic traces
        run: whystall demo --out /tmp/demo --steps 8
        if: runner.os == 'Linux'
      - name: End-to-end pipeline on synthetic traces (Windows)
        run: whystall demo --out demo --steps 8
        if: runner.os == 'Windows'
